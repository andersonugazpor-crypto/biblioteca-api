spring.application.name=biblioteca-api
server.port=8080

# ---------------- Base de datos: MySQL (por defecto) ----------------
# La base "biblioteca_db" se crea automáticamente. Ajuste usuario/clave
# o defina las variables de entorno DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblioteca_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA / Hibernate ----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Carga por lotes de colecciones perezosas (evita el problema N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# ---------------- JWT ----------------
# Clave HMAC-SHA256 en Base64 (256 bits). En producción defina JWT_SECRET.
jwt.secreto=${JWT_SECRET:dTNmN2E5YjJjNGQ2ZThmMGExYjNjNWQ3ZTlmMWEzYjVjN2Q5ZTFmM2E1YjdjOWQx}
jwt.expiracion-minutos=30
jwt.refresh-expiracion-dias=7
jwt.emisor=biblioteca-api

# ---------------- Reglas de la biblioteca ----------------
biblioteca.max-prestamos-activos=3
biblioteca.dias-prestamo-por-defecto=7
biblioteca.multa-por-dia=1.00

# ---------------- Paginación y documentación ----------------
spring.data.web.pageable.max-page-size=50
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Lima
